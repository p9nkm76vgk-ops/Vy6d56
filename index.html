<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Entreno OS</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Ignición: tema oscuro único y deliberado. Un solo acento naranja para lo activo; verde/ámbar/rojo solo para la disposición.
   Layout: columna de 760 px; 3 pestañas abajo en móvil, rail lateral en iPad. Números en Barlow Condensed, interfaz en Inter Tight. */
:root{
  --bg:#0B0B0D; --s1:#141417; --s2:#1C1C21; --s3:#26262C; --line:#2E2E35;
  --fg:#F5F5F7; --fg2:#A1A1AA; --fg3:#6B6B73;
  --acc:#3D7BFF; --acc2:#5B8CFF; --acc3:#2F5BFF; --acc-soft:rgba(61,123,255,.16); --on-acc:#FFFFFF;
  --ok:#34D399; --mid:#FBBF24; --bad:#F43F5E;
  --ph-ecc:#38BDF8; --ph-iso:#E5E7EB; --ph-con:#FF3D71; --ph-top:#FFD23F;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Inter Tight",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:16px; color-scheme:dark;
  --warn:var(--bad); --accent:var(--acc); --muted:var(--fg2); --ink:var(--fg); --soft:var(--s2); --surface:var(--s1); --brass:var(--mid); --accent-ink:var(--on-acc);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 116px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
h1{font-family:var(--f-num);font-weight:800;font-size:52px;line-height:.92;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-num);font-weight:700;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.03em}
h3{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--fg2);margin:0}
.view{display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* Navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;background:rgba(11,11,13,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:160px;min-height:54px;border:0;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--fg3)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--acc)}
@media (min-width:900px){
  .tabs{top:0;right:auto;bottom:0;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);
    padding:calc(28px + env(safe-area-inset-top,0px)) 10px 24px max(10px,env(safe-area-inset-left,0px))}
  .tab{flex:none;padding:12px 4px}
  .wrap{padding-block:34px 48px;margin-left:max(120px,calc(50% - 380px + 48px))}
}

/* Elementos base */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:600;color:var(--fg)}
.chip.acc{background:var(--acc-soft);color:var(--acc)} .chip.ok{color:var(--ok)} .chip.warn,.chip.brass{color:var(--mid)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.primary{border:0;background:linear-gradient(135deg,var(--acc2),var(--acc3));color:var(--on-acc);border-radius:var(--r);min-height:62px;padding:14px 20px;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;width:100%;display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--f-ui)}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.4}
.secondary{border:1px solid var(--line);background:var(--s2);border-radius:var(--r);min-height:52px;padding:12px 16px;font-weight:700;width:100%}
.quiet{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.link{border:0;background:none;color:var(--fg2);font-weight:600;font-size:14px;min-height:44px;padding:6px 2px;text-decoration:underline;text-decoration-color:var(--fg3);text-underline-offset:3px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:12px;min-height:48px;padding:10px 14px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--fg2);font-size:14px}
.note b{color:var(--fg)}
.empty{color:var(--fg2);font-size:14px;margin:0}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:44px;padding:8px;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--fg)}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s2);border-radius:12px;padding:4px 12px;font-size:14px}
.tq{color:var(--acc);font-weight:600}

/* Filas de ejercicios */
.block{display:flex;flex-direction:column}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px 10px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;min-height:64px;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover .row-n{color:var(--acc)}
.lbl{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--fg3)}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--s2);display:grid;place-items:center;position:relative}
.thumb svg{width:40px;height:40px}
.thumb b{position:absolute;top:-4px;left:-4px;font-family:var(--f-num);font-size:12px;background:var(--bg);color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:0 4px;line-height:16px}
.row-n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row-c{color:var(--fg2);font-size:13px;margin-top:1px}
.row-t{text-align:right;white-space:nowrap}
.row-t .num{font-size:24px;font-weight:700}
.row-t small{display:block;color:var(--fg3);font-size:12px}
.thin{padding:12px 2px;border-bottom:1px solid var(--line);color:var(--fg3);font-size:13px}

/* Hoy */
.ready{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;width:100%}
.ready .dial{width:92px;height:92px;position:relative}
.ready .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.ready .dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:36px;font-weight:800}
.ready .st{font-family:var(--f-num);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.contrib{display:flex;flex-direction:column;gap:8px}
.contrib div{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:13px;color:var(--fg2)}
.contrib i{display:block;height:6px;border-radius:3px;background:var(--s3);position:relative;overflow:hidden}
.contrib i s{position:absolute;top:0;bottom:0;left:50%}
.ci{display:flex;flex-direction:column;gap:10px}
.ci .row3{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--fg2)}
.ci .seg button{font-size:13px}
.sess{background:radial-gradient(120% 90% at 100% 0%,rgba(61,123,255,.18),transparent 60%),var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sess .dur{font-family:var(--f-num);font-size:64px;font-weight:800;line-height:.9}
.sess .dur small{font-size:20px;color:var(--fg2);margin-left:4px}
.resume{display:flex;flex-direction:column;gap:8px;background:var(--acc-soft);border:1px solid var(--acc);border-radius:var(--r);padding:14px}
.report{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.report ul{margin:0;padding-left:1.1em;color:var(--fg2);font-size:14px}
.report li b{color:var(--fg)}

/* Plan */
.week{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;min-height:66px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.day .d{font-family:var(--f-num);font-size:14px;font-weight:600;text-transform:uppercase;color:var(--fg3);line-height:1}
.day .d .num{display:block;font-size:30px;color:var(--fg)}
.day.today{background:var(--s1);border-radius:14px;border-bottom-color:transparent;padding-inline:10px;margin-inline:-10px;width:calc(100% + 20px)}
.day.today .d .num{color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--s3)}
.dot.ok{background:var(--acc)}
.int{display:inline-flex;gap:2px;vertical-align:middle;margin-left:8px}
.int i{width:5px;height:11px;border-radius:1px;background:var(--s3)}
.int i.on{background:var(--acc)}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cycle div{border-radius:12px;padding:10px 8px;background:var(--s2);font-size:12px;color:var(--fg2);min-width:0}
.cycle div b{display:block;font-family:var(--f-num);font-size:17px;text-transform:uppercase;color:var(--fg);font-weight:700;overflow-wrap:anywhere}
.cycle div.now{background:var(--acc);color:var(--on-acc)}
.cycle div.now b{color:var(--on-acc)}
.field{display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:48px}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--s3);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--acc)}
.switch[aria-pressed="true"]::after{transform:translateX(20px);background:var(--on-acc)}
input[type=date],textarea,input[type=text]{width:100%;min-height:48px;border:1px solid var(--line);background:var(--s2);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.section-t{margin-top:10px}

/* Progreso */
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hs{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hs .num{display:block;font-size:40px;font-weight:800;line-height:1}
.hs span{display:block;color:var(--fg2);font-size:12px;margin-top:4px}
.hs.acc .num{color:var(--acc)}
.lvls{display:flex;flex-direction:column;gap:12px}
.lvl{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.lvl .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.lvl .bar i{height:10px;border-radius:2px;background:var(--s3)}
.lvl .bar i.on{background:var(--acc)}
.lvl .num{font-size:22px;font-weight:800;text-align:right}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.weeks i{aspect-ratio:1;border-radius:5px;background:var(--s2);max-width:100%}
.weeks i.ok{background:var(--acc)} .weeks i.part{background:var(--acc-soft)}
.prs{display:flex;flex-direction:column}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis b{display:block;font-size:28px;line-height:1}
.kpis span{font-size:12px;color:var(--fg2)}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:10px;border-radius:3px;background:var(--s3)}
.ladder i.on{background:var(--acc)}
.vlad{display:flex;gap:3px;margin-top:4px}
.vlad i{width:14px;height:5px;border-radius:2px;background:var(--s3)}
.vlad i.on{background:var(--acc)}

/* Hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s2);width:100%;max-width:560px;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet .row{border-bottom-color:var(--s3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--fg2)} .kv dd{margin:0;font-weight:600}
.sheet-fig{background:var(--s1);border-radius:16px;display:grid;place-items:center;padding:8px}
.sheet-fig svg{width:160px;height:160px}

/* Modo entreno */
.go{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;--ph:var(--fg3);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.go::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 42%,color-mix(in srgb,var(--ph) 16%,transparent),transparent 70%);pointer-events:none;transition:background .25s}
.go>*{position:relative}
.go.ph-ecc{--ph:var(--ph-ecc)} .go.ph-iso{--ph:var(--ph-iso)} .go.ph-con{--ph:var(--ph-con)} .go.ph-top{--ph:var(--ph-top)} .go.ph-work{--ph:var(--acc)}
.go.ph-rest{--ph:var(--fg3)} .go.ph-hold{--ph:var(--acc)} .go.ph-run{--ph:var(--acc)} .go.ph-walk{--ph:var(--ph-ecc)} .go.ph-prep,.go.ph-switch{--ph:var(--ph-top)} .go.ph-list{--ph:var(--fg3)}
.go-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog{height:4px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--acc)}
.go-body{flex:1;display:grid;grid-template-columns:1fr;align-content:center;justify-items:center;gap:14px;max-width:620px;width:100%;margin:0 auto;overflow:auto;padding-block:10px}
.go-main{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0;width:100%}
.go-side{display:flex;flex-direction:column;gap:8px;text-align:center;color:var(--fg2);font-size:14px;max-width:44ch}
.go-side b{color:var(--fg)}
.go-name{font-family:var(--f-num);font-weight:800;font-size:clamp(28px,7.5vw,48px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.go-cue{color:var(--fg2);max-width:42ch;margin:0 auto}
.go-tag{display:inline-block;margin:0 auto;padding:6px 12px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:14px;max-width:44ch}
.go-list{text-align:left;margin:0 auto;padding-left:1.1em;max-width:40ch}
.go-list li{margin:5px 0}
.stage{display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.fig{width:min(24vw,140px);height:min(24vw,140px);flex:0 1 auto;min-width:0}
.fig svg{width:100%;height:100%;overflow:visible}
.fx3{width:100%;height:100%;display:block}
.fig.in .fx3{border-radius:50%}
.thumb img.fx3{width:44px;height:44px;border-radius:12px}
.sheet-fig img.fx3{width:180px;height:180px}
.ringwrap{position:relative;width:min(58vw,300px);max-width:100%;aspect-ratio:1;flex:0 0 auto}
.stage{max-width:100%}
.ringwrap.center{width:min(80vw,360px)}
.rin .fig.in{width:74%;height:74%}
.under{display:flex;align-items:baseline;justify-content:center;gap:18px;flex-wrap:wrap}
.uph{font-family:var(--f-num);font-weight:800;font-size:clamp(48px,13vw,76px);line-height:.9;text-transform:uppercase;letter-spacing:.03em;color:var(--ph);transition:color .15s}
.ureps{font-size:clamp(40px,11vw,64px);font-weight:700;color:var(--fg3);line-height:.9}
.ureps b{color:var(--fg)}
.go.final .ureps b{color:var(--acc)}
.rin .big.long{font-size:clamp(52px,14vw,96px)}
.gring{width:100%;height:100%;display:block}
.gring .rtrack{fill:none;stroke:var(--s2);stroke-width:14}
.gring .rarc{fill:none;stroke:var(--ph);stroke-width:14;stroke-linecap:round;transition:stroke .2s}
.gring .tk{stroke:var(--s3);stroke-width:5;stroke-linecap:round}
.gring .tk.done{stroke:var(--fg)} .gring .tk.cur{stroke:var(--ph)}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rin .big{font-family:var(--f-num);font-weight:800;font-size:clamp(84px,24vw,150px);line-height:.85;font-variant-numeric:tabular-nums}
.rin .big small{font-size:.32em;color:var(--fg3);font-weight:700}
.rin .ph{font-family:var(--f-num);font-weight:800;font-size:clamp(24px,6.4vw,34px);text-transform:uppercase;letter-spacing:.06em;color:var(--ph)}
.rin .sm{font-size:13px;color:var(--fg2)}
.go.final .rin .big{color:var(--acc)}
.go.final::before{background:radial-gradient(80% 60% at 50% 42%,rgba(61,123,255,.28),transparent 70%)}
.tstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tstrip span{padding:6px 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--fg3);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.tstrip span b{font-family:var(--f-num);font-size:16px;margin-left:2px}
.tstrip span.on{background:var(--ph);color:#0B0B0D;border-color:transparent}
.go-foot{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ctrls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.cbtn{min-height:68px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;color:var(--fg)}
.cbtn svg{width:28px;height:28px}
.cbtn.main{background:var(--fg);color:var(--bg);border-color:transparent}
.ctrl-extra{display:flex;justify-content:center;gap:10px}
.ctrl-extra .secondary{width:auto;min-width:120px;min-height:48px}
.rate-q{font-weight:600;text-align:center}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);min-height:64px;padding:10px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

/* ============ Periodización ============ */
/* Semanas efectivas de plan: no cuentan las de exámenes */
function effWeek(date){const ws=weekStartOf(date),st=weekStartOf(S.settings.start);if(ws<st)return 0;let n=Math.floor(daysBetween(st,ws)/7)+1;(S.maint||[]).forEach(m=>{if(m>=st&&m<ws)n--});return n}
function weekNo(date){return Math.max(1,effWeek(date))}
function phaseOf(date){
  const ws=weekStartOf(date);
  if((S.maint||[]).includes(ws))return{k:"mant",w:1,...PHASES.mant};
  const w=effWeek(date);
  if(w<=1)return{k:"vuelta1",w:1,...PHASES.vuelta1};
  if(w===2)return{k:"vuelta2",w:2,...PHASES.vuelta2};
  if(S.forced.includes(ws))return{k:"desc",forced:true,block:0,w:4,...PHASES.desc};
  const i=S.anchor&&ws>=S.anchor?effWeek(date)-effWeek(S.anchor):w-3,k=CYCLE[i%4];
  return{k,w:i%4+1,block:Math.floor(i/4)+1,...PHASES[k]};
}
function evaluateWeeks(){
  const ws=weekStartOf(todayISO()),lw=addDays(ws,-7);
  if(S.evald[lw]||effWeek(lw)<3||lw<weekStartOf(S.settings.start))return;
  const ph=phaseOf(lw);S.evald[lw]=true;
  const vch=weeklyVolume(lw);if(vch.length)S.volLog[ws]=vch;
  if(ph.k==="desc"||ph.k==="mant"){save();return}
  let duro=0,skip=0;for(let i=0;i<7;i++){const l=S.logs[addDays(lw,i)];if(!l)continue;duro+=l.duro||0;if(l.st==="skip")skip++}
  if((duro>=3||skip>=2)&&phaseOf(ws).k!=="desc"){S.forced.push(ws);S.anchor=addDays(ws,7);S.autoDeload=ws}
  save();
}

/* ============ Sesión ============ */
function prog(id){const e=EX[id],p=S.prog[id]||{};const vi=Math.min(p.vi||0,e.v.length-1);return{t:p.t??e.r[0],vi,last:p.last||null,maxed:!!p.maxed}}
function exName(e,vi){const v=e.v[vi];return v?e.n+" · "+v:e.n}
function horaIni(){const m=/^(\d{1,2}):(\d{2})$/.exec(S.settings.hora||"17:00");return m?+m[1]*60+ +m[2]:1020}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function franja(date){const a=horaIni();return hhmm(a)+"–"+hhmm(a+durOf(date))}
function cuandoTxt(date){if(date!==todayISO())return"";const n=new Date(),nm=n.getHours()*60+n.getMinutes(),a=horaIni(),b=a+durOf(date);if(nm<a-1){const r=a-nm;return"Empieza en "+(r>=60?Math.floor(r/60)+" h "+(r%60?r%60+" min":""):r+" min")}if(nm<b)return"Es la hora: dale a empezar";return""}
function durOf(date){return phaseOf(date).k==="mant"?30:(S.dur[date]||(S.short&&S.short[date]?30:0)||S.settings.dur||60)}
function isShort(date){return durOf(date)<=30}
function runLevel(){return Math.max(1,Math.min(RUN.length,Math.floor(S.run.lv)))}
function maxRecentRun(date){let m=0;for(let i=1;i<=30;i++){const l=S.logs[addDays(date,-i)];if(l&&l.runSec)m=Math.max(m,l.runSec)}return m}
/* Sprints solo con base: semana efectiva ≥ 5 y nivel de carrera ≥ 4. Antes, cuestas andando rápido. */
function sprintsUnlocked(date){return effWeek(date)>=5&&runLevel()>=4}
function sprintPlan(ph,date){
  if(!sprintsUnlocked(date))return{walk:true,n:8,s:30,r:60};
  if(ph.k==="desc")return{n:6,s:8,r:100};
  let wk=0;for(let d=addDays(weekStartOf(date),-7);d>=weekStartOf(S.settings.start)&&wk<6;d=addDays(d,-7)){if(effWeek(d)>=5)wk++}
  return{n:Math.min(10,6+wk),s:ph.k==="acum"?8:10,r:100};
}
function runPhases(kind,lv,ph,date,short){
  if(kind==="paseo")return[{t:"Anda a paso vivo",s:1200,k:"walk"}];
  if(kind==="intermit"||kind==="hiitcinta"){const ok=sprintsUnlocked(date),o=[{t:"Andar",s:120,k:"walk"}];
    const[w,r,n]=kind==="intermit"?(ok?[15,15,16]:[30,30,10]):[30,90,6];
    for(let i=0;i<n;i++){o.push(ok?{t:"Correr",s:w,k:"run"}:{t:"Anda rápido en cuesta",s:w,k:"walk",fast:1});if(i<n-1)o.push({t:ok?"Para":"Andar",s:r,k:"walk"})}
    o.push({t:"Andar",s:120,k:"walk"});return o}
  if(kind==="sprint"){const sp=sprintPlan(ph,date);const o=[{t:"Andar",s:180,k:"walk"}];for(let i=0;i<sp.n;i++){o.push(sp.walk?{t:"Anda rápido en cuesta",s:sp.s,k:"walk",fast:1}:{t:"Sprint",s:sp.s,k:"run"});o.push({t:"Andar",s:sp.r,k:"walk"})}o.pop();o.push({t:"Andar",s:120,k:"walk"});return o}
  let[r,w,n]=RUN[lv-1];let reps=n,run=r;
  if(kind==="dom"&&lv>=12)run=Math.round(r*1.1/60)*60;
  if(ph.k==="desc"||ph.k==="vuelta1"){if(n>1)reps=Math.max(2,reps-1);else run=Math.round(run*.75/60)*60}
  const cap=maxRecentRun(date)*1.1; // regla del 10 % sobre la salida más larga de 30 días
  const runSec=()=>reps*run;
  if(cap>0){while(runSec()>cap&&reps>2)reps--;if(runSec()>cap&&reps===1)run=Math.max(600,Math.floor(cap/60)*60)}
  if(short){const lim=17*60;while(runSec()+(reps-1)*w>lim&&reps>2)reps--;if(reps===1&&run>lim)run=lim}
  const o=[{t:"Andar",s:short?180:300,k:"walk"}];
  for(let i=0;i<reps;i++){o.push({t:"Correr",s:run,k:"run"});if(w&&i<reps-1)o.push({t:"Andar",s:w,k:"walk"})}
  o.push({t:"Andar",s:short?120:240,k:"walk"});return o;
}
const mm=s=>s%60?(Math.floor(s/60)+":"+String(s%60).padStart(2,"0")):(s/60)+" min";
const RUN_NAME={intermit:"Resistencia intermitente",hiitcinta:"Intervalos en cuesta",paseo:"Paseo activo",sprint:"Cuestas",z2:"Carrera en zona 2",dom:"Carrera suave",fin:"Carrera extra en zona 2",cuesta:"Caminata en cuesta"};
const rated=r=>r==="z2"||r==="dom";
/* Bloques de relleno: carrera suave al nivel actual o caminata en cuesta, cortados al segundo */
function finPhases(kind,sec,lv){
  if(kind==="cuesta")return[{t:"Anda en cuesta",s:sec,k:"walk"}];
  const[r,w]=RUN[lv-1],o=[];let left=sec;
  if(!w){return[{t:"Correr",s:sec,k:"run"}]}
  while(left>0){const a=Math.min(r,left);o.push({t:"Correr",s:a,k:"run"});left-=a;if(left<=0)break;const b=Math.min(w,left);o.push({t:"Andar",s:b,k:"walk"});left-=b}
  return o;
}
function runLabel(it){
  if(it.run==="cuesta")return mm(it.ph[0].s)+" andando rápido con la cinta al 8–12 %";
  if(it.run==="fin"){const runs=it.ph.filter(x=>x.k==="run");return mm(it.ph.reduce((a,x)=>a+x.s,0))+" suaves"+(runs.length>1?" alternando correr y andar":"")+" al final de la sesión"}
  const runs=it.ph.filter(x=>x.k==="run");
  if(it.run==="paseo")return"20 min a paso vivo";
  if(it.run==="intermit"||it.run==="hiitcinta"){const w=it.ph.filter(x=>x.k==="run"||x.fast);return w.length+" × "+w[0].s+" s "+(w[0].fast?"andando rápido en cuesta":"rápidos")}
  if(it.run==="sprint"){if(!runs.length){const f=it.ph.filter(x=>x.fast);return f.length+" × "+f[0].s+" s andando rápido en cuesta al 10–15 %"}return runs.length+" × "+runs[0].s+" s de sprint en cuesta"}
  if(runs.length===1)return mm(runs[0].s)+" seguidos a ritmo de conversación";
  const walk=it.ph.find((x,i)=>i>0&&x.k==="walk"&&i<it.ph.length-1);
  return runs.length+" × "+mm(runs[0].s)+" corriendo / "+mm(walk?walk.s:0)+" andando";
}
function SUB(id){const q=S.equip||{};let r=id;if(q.dominadas){if(id==="jalon1")r="dominada";if(id==="invsup")r="chinup";if(id==="lsit"||id==="revcrunch")r="colgado"}if(q.anillas){if(id==="fondos")r="fondosan";if(id==="invertido")r="remoan"}const w=S.swap&&S.swap[id];if(w){ensureEx(w);if(EX[w])r=w}return r}
function parseItem(s){
  if(s==="sprint")return{run:"sprint"};
  if(s==="mob")return{mob:true};
  if(s.startsWith("seq:"))return{seq:s.slice(4).replace("?",""),opt:s.endsWith("?")};
  if(s==="intermit"||s==="hiitcinta")return{run:s};
  if(s.startsWith("run:"))return{run:s.slice(4)};
  const m=s.match(/^([A-Z0-9])(\d)?:(\w+)(?:\*(\d))?(!m)?(\?)?$/);
  return{g:m[1],gi:m[2]||"",orig:m[3],id:SUB(m[3]),sets:m[4]?+m[4]:null,myo:!!m[5],opt:!!m[6]};
}
function rirFor(e,ph,tired){if(e.k==="p")return null;let r=e.k==="i"?ph.ri:ph.rc;if(e.nofail&&r==="0")r="1";const b=tired===true?1:(+tired||0);if(b)r=r.replace(/\d/g,d=>Math.min(4,+d+b));return r}
function techFor(e,ph){if(e.k!=="i")return null;if(ph.k==="intens")return"Al acabar la última serie, parciales en la parte estirada hasta el fallo.";if(ph.k==="pico")return e.tq||"Al acabar la última serie, parciales en la parte estirada hasta el fallo.";return null}
function sessionFor(date){
  const ph=phaseOf(date),exam=false,mant=ph.k==="mant",short=isShort(date);let day=dayFor(date);
  const rd=readiness(date),over=!!S.noauto[date],mode=S.tired[date]?"moderado":over?"listo":(rd.force&&rd.st==="listo"?"moderado":rd.st),tired=mode!=="listo",auto=!over&&rd.st!=="listo"?RD[rd.st].a:null,volUsed={};
  const jc={};Object.keys(JOINT).forEach(j=>{const n=jointCount(j,date);if(n)jc[j]=n});
  const ci=S.checkin[date]||{};
  /* Disposición muy baja con energía baja o agujetas fuertes: el día de fuerza pasa a movilidad (reversible) */
  let swapped=null;
  if(!over&&!day.calm&&day.int>=2&&rd.st==="recuperar"&&(ci.energy===-1||ci.sore===2)){swapped=day.n;day=CALM_DAYS.movil}
  let list=(short?day.short:day.long).slice();
  list=list.filter(r=>{const p=parseItem(r);if(p.id&&CURATED_REQ[p.id]&&!canUse(CURATED_REQ[p.id]))return false;if(p.id==="emom"&&rd.score<70)return false;return true});
  const prot=[];
  const mk=raw=>{
    const it=parseItem(raw);
    if(it.mob)return{mob:true};
    if(it.seq)return{seqKey:it.seq,seq:SEQ[it.seq].els,name:SEQ[it.seq].n,opt:it.opt,g:null};
    if(it.run){const lv=runLevel(),p=runPhases(it.run,lv,ph,date,short);return{run:it.run,lv,ph:p}}
    let soft=false;
    for(const j in jc){if(JOINT[j].includes(it.id)){if(jc[j]>=2){const avoid=new Set(JOINT[j].concat(list.map(r=>{const p=parseItem(r);return p.id}).filter(Boolean)));const alt=alternatives(it.orig,avoid)[0];if(alt){ensureEx(alt);prot.push(EX[it.id].n+" → "+EX[alt].n);it.id=alt}}else soft=true}}
    ensureEx(it.id);
    const e=EX[it.id],p=prog(it.id),myo=it.myo||!!e.myo;
    let sets=it.sets||e.s;
    if(myo)sets=1;
    else{
      if(ph.k==="vuelta1")sets=Math.min(2,sets);
      if(it.id==="domsub"&&S.pull&&S.pull.max)S.prog.domsub=Object.assign({},S.prog.domsub,{t:Math.max(2,Math.round(S.pull.max/2))});
      if(ph.k==="desc"||exam)sets=Math.max(1,Math.ceil(sets*.6));
      if(mode==="recuperar")sets=Math.max(1,Math.ceil(sets*.6));
      else if((mode==="moderado"&&it.g!=="A"&&it.g!=="1")||soft)sets=Math.max(1,sets-1);
      const gg=GROUP[muscleOf(it.orig)];if(gg&&S.vol[gg]&&!volUsed[gg]&&e.k!=="p"&&ph.k!=="desc"&&!ph.k.startsWith("vuelta")){volUsed[gg]=1;sets=Math.max(1,sets+S.vol[gg])}
    }
    return{...it,e,p,myo,sets,base:sets,soft,rir:rirFor(e,ph,mode==="recuperar"?2:(tired||soft)?1:0),tech:myo||tired||soft?null:techFor(e,ph),cal:ph.k==="acum"&&e.cal};
  };
  const items=list.map(mk);
  /* Estrés alto con energía normal: se mantiene la sesión y se añade calma al final */
  if(!day.calm&&ci.stress===2&&ci.energy!==-1)items.push(mk("seq:calma"));
  const ses={day,swapped,items,ph,short,tired,auto,mode,rd,prot,joints:Object.keys(jc),target:durOf(date)*60};
  fitSession(ses);
  /* Si sobra tiempo, se rellena con trabajo útil, no con descansos más largos */
  const gapNow=()=>ses.target-buildTimeline(ses,true).total,dw=dow(date);
  if(!mant&&!day.calm&&(dw===0||dw===4||dw===2)&&gapNow()>=300){
    const have=new Set(ses.items.map(i=>i.id));
    const pool=["rueda","pallof","copen","deadbug","hollow","dragon"].filter(x=>!have.has(SUB(x)));
    let added=0;for(const raw of pool){if(gapNow()<300||added>=1)break;const it=mk("X:"+raw);it.g="X";it.gi="";ses.items.push(it);if(gapNow()<0){ses.items.pop();continue}added++}
  }
  const g=gapNow();
  if(g>=240&&!day.calm){
    /* Freno de carrera: relleno corriendo solo con base (semana ≥ 5) y sin superar el 110 % de tu salida más larga */
    const cap=maxRecentRun(date)*1.1,easy=mant||effWeek(date)<5||mode==="recuperar"||dw===0||dw===4||dw===2||dw===6;
    let kind=easy?"cuesta":"fin";const sec=Math.floor((g-30)/30)*30;
    if(sec>=180){let p=finPhases(kind,sec,runLevel());if(kind==="fin"&&p.filter(x=>x.k==="run").reduce((a,x)=>a+x.s,0)>cap){kind="cuesta";p=finPhases(kind,sec,runLevel())}ses.items.push({run:kind,lv:runLevel(),ph:p,g:"F",gi:""})}
  }
  ses.min=durOf(date);
  return ses;
}

/* ============ Progresión por ejercicio ============ */
function progressExercise(id,rating,date,wins){
  const e=EX[id];if(!e||e.k==="p"||e.k==="time"&&!rating)return;
  const p=Object.assign({t:e.r[0],vi:0,hits:0,dz:0},S.prog[id]);
  const step=(e.u&&e.u[0]==="s")?5:(e.u==="m/lado"?5:1);
  const wasMax=p.t>=e.r[1];const before=p.t;
  if(rating==="facil")p.t+=2*step;else if(rating==="bien")p.t+=step;
  if(p.t>e.r[1])p.t=e.r[1];
  if(rating==="duro"){p.dz=(p.dz||0)+1;p.hits=0}else p.dz=0;
  if(wasMax&&rating!=="duro")p.hits=(p.hits||0)+(rating==="facil"?2:1);
  p.last={t:before,r:rating,d:date};
  if(p.hits>=2){
    if(p.vi<e.v.length-1){p.vi++;p.t=e.r[0];p.hits=0;wins.push({t:"Nueva variante: "+exName(e,p.vi),s:"Vuelves a "+e.r[0]+" con la versión más difícil."})}
    else if((e.ld==="w"&&S.equip.cargables)||(e.ld==="bw"&&S.equip.chaleco)){p.kg=(p.kg||0)+2.5;p.t=e.r[0];p.hits=0;p.maxed=false;wins.push({t:"+2,5 kg en "+e.n,s:"Vuelves a "+e.r[0]+" reps con más carga. Ahora: "+loadTxt(id,p)})}
    else if(!p.maxed){p.maxed=true;wins.push({t:e.n+": al tope",s:"Para seguir subiendo hará falta más carga."})}
  }else if(p.t>before)wins.push({t:"+"+(p.t-before)+(step===5?(e.u==="m/lado"?" m":" s"):" rep"+(p.t-before>1?"s":""))+" en "+e.n,s:"La próxima vez: "+p.t});
  if(p.dz>=2&&p.t<=e.r[0]&&p.vi>0){p.vi--;p.dz=0;wins.push({t:e.n+": variante anterior",s:"Dos sesiones duras seguidas en el mínimo. Consolida y vuelve a subir."})}
  S.prog[id]=p;
}
function progressRun(rating,pain,wins){
  const before=runLevel();
  if(pain)S.run.lv=Math.max(1,S.run.lv-1);
  else if(rating==="facil")S.run.lv=Math.min(RUN.length,S.run.lv+.5);
  else if(rating==="bien")S.run.lv=Math.min(RUN.length,S.run.lv+.34);
  const after=runLevel();
  if(after>before)wins.push({t:"Carrera: nivel "+after,s:"La próxima: "+RUN[after-1][2]+" × "+mm(RUN[after-1][0])+" corriendo"});
  if(pain)wins.push({t:"Carrera: bajas a nivel "+after,s:"Con dolor se repite o se baja. Si sigue, consulta a un fisio."});
}
function finishSession(date,ratings,ses,extra){
  const wins=[];let duro=0,runSec=0;
  ses.items.forEach(i=>{
    if(i.run){const r=ratings["run:"+i.run];if(rated(i.run)){runSec=i.ph.filter(x=>x.k==="run").reduce((a,x)=>a+x.s,0);if(r&&ses.ph.k!=="desc"&&ses.ph.k!=="mant")progressRun(r.r,r.pain,wins)}return}
    if(!i.id)return;const r=ratings[i.id];if(!r)return;if(r==="duro")duro++;
    if(ses.ph.k!=="desc"&&ses.ph.k!=="mant")progressExercise(i.id,r,date,wins);
  });
  const ex=ses.items.filter(i=>i.id).map(i=>({id:i.id,n:exName(i.e,i.p.vi),s:i.sets,t:i.e.r[0]===i.e.r[1]?i.e.r[0]:i.p.t,u:unitShort(i.e),r:ratings[i.id]||null,l:loadTxt(i.id)||"",tp:i.e.tp||TEMPO_DEF[i.e.k]||""}));
  const runs=ses.items.filter(i=>i.run).map(i=>({k:RUN_NAME[i.run]||"Carrera",m:Math.round(i.ph.reduce((a,x)=>a+x.s,0)/60),r:(ratings["run:"+i.run]||{}).r||null}));
  const seqs=ses.items.filter(i=>i.seq).map(i=>i.name);
  S.logs[date]=Object.assign({st:"done",seqs,runs,ph:ses.ph.n,duro,runSec:runSec?Math.round(runSec*(ses.runScale||1)):undefined,day:ses.day.n,dur:Math.round(ses.target/60),ex},extra||{});
  if(extra&&extra.srpe)S.logs[date].load=extra.srpe*(extra.min||Math.round(ses.target/60));

}

/* ============ Disposición del día (0–100, sin sensores) ============
   Base 70 ± sueño, energía, agujetas, rendimiento reciente, pico de carga frente a tu media, malas noches.
   Pesos heurísticos inspirados en Whoop/Oura/Garmin: el número compara contigo mismo, no es una medida clínica. */
function readiness(date){
  const ci=S.checkin[date]||{},parts=[];let score=70;
  const add=(k,v)=>{if(v){score+=v;parts.push({k,v})}};
  if(ci.sleep!=null)add("Sueño",ci.sleep<0?-15:ci.sleep>0?5:0);
  if(ci.stress)add("Estrés de estudio",ci.stress===2?-8:-3);
  if(ci.mood===-1)add("Ánimo",-5);
  if(ci.energy!=null)add("Energía",8*ci.energy);
  if(ci.sore)add("Agujetas",-6*ci.sore);
  const recent=[];for(let i=1;i<=10&&recent.length<3;i++){const l=S.logs[addDays(date,-i)];if(l&&l.st==="done"&&l.ex)recent.push(l)}
  let f=0,d=0,n=0;recent.forEach(l=>l.ex.forEach(x=>{if(!x.r)return;n++;if(x.r==="facil")f++;if(x.r==="duro")d++}));
  if(n)add("Rendimiento",Math.max(-10,Math.min(8,Math.round(25*(f-d)/n))));
  if(Object.values(S.logs).filter(l=>l.load).length>=6){const A=ewma(loadSeries(addDays(date,-1),56),7).slice(-28),m=A.reduce((a,x)=>a+x,0)/28,sd=Math.sqrt(A.reduce((a,x)=>a+(x-m)**2,0)/28);if(sd>0)add("Carga reciente",-Math.max(0,Math.min(12,Math.round(5*(A[27]-m)/sd))))}
  let bad=0;for(let i=1;i<=3;i++){const c=S.checkin[addDays(date,-i)];if(c&&c.sleep<0)bad++}add("Noches malas",-3*bad);
  const sr=[];for(let i=1;i<=10&&sr.length<2;i++){const l=S.logs[addDays(date,-i)];if(l&&l.srpe)sr.push(l.srpe)}
  if(sr.length===2&&sr[0]>=9&&sr[1]>=9)add("Sesiones muy duras",-10);
  score=Math.max(0,Math.min(100,Math.round(score)));
  const st=score>=67?"listo":score>=34?"moderado":"recuperar",worst=parts.filter(p=>p.v<0).sort((a,b)=>a.v-b.v)[0];
  return{score,st,parts,why:worst?worst.k:null,has:ci.sleep!=null||ci.energy!=null,force:ci.sleep===-2};
}

function weeklyVolume(lw){
  const ph=phaseOf(lw);if(ph.k==="desc"||ph.k==="mant"||ph.k.startsWith("vuelta"))return[];
  const agg={};for(let i=0;i<7;i++){const l=S.logs[addDays(lw,i)];if(!l||!l.ex)continue;l.ex.forEach(x=>{if(!x.r)return;const g=GROUP[muscleOf(x.id)];if(!g)return;const a=agg[g]||(agg[g]={f:0,d:0,n:0});a.n++;if(x.r==="facil")a.f++;if(x.r==="duro")a.d++})}
  const ch=[];
  Object.entries(agg).forEach(([g,a])=>{if(a.n<3)return;const cur=S.vol[g]||0;let nv=cur;if(a.d/a.n>=.5)nv=Math.max(-2,cur-1);else if((a.f-a.d)/a.n>=.5&&a.d===0)nv=Math.min(2,cur+1);if(nv!==cur){S.vol[g]=nv;ch.push([g,nv-cur])}});

}

  const t=targetOf(i),vi=i.p.vi,kg=(S.prog[i.id]||{}).kg||0;

function commitPRs(ses,rat,date){

/* ============ Constancia (5 de 7 = semana cumplida, 2 comodines) ============ */
function weekDone(ws){let n=0;for(let i=0;i<7;i++){const l=S.logs[addDays(ws,i)];if(l&&l.st==="done")n++}return n}
function consistency(){
  const t=todayISO(),ws=weekStartOf(t),first=Object.keys(S.logs).sort()[0];
  let total=0,streak=0,counting=true;
  if(first){for(let w=weekStartOf(first);w<=ws;w=addDays(w,7)){if(weekDone(w)>=5)total++}}
  for(let w=addDays(ws,-7);first&&w>=weekStartOf(first);w=addDays(w,-7)){if(weekDone(w)>=5&&counting)streak++;else counting=false}
  if(weekDone(ws)>=5)streak++;
  return{total,streak,now:weekDone(ws),count:Object.values(S.logs).filter(l=>l.st==="done").length};
}

function levels(){

  const acc={};
  ids.forEach(id=>{ensureEx(id);const e=EX[id];if(!e||e.k==="p"||e.u==="min")return;const g=GROUP[muscleOf(id)];if(!g)return;const p=prog(id),span=Math.max(1,e.r[1]-e.r[0]);
    let v=(p.vi+Math.min(1,(p.t-e.r[0])/span))/e.v.length;v=Math.min(1,v+((S.prog[id]||{}).kg||0)/25);
    (acc[g]||(acc[g]=[])).push(v)});
  const out=["hombro","empuje","tiron","pierna","core"].map(g=>{const a=acc[g]||[0];return[g,1+Math.floor(9*a.reduce((s,x)=>s+x,0)/a.length)]});

}

/* ===================================================================
   MODO ENTRENO AUTOMÁTICO
   La sesión se convierte en una línea de tiempo de segmentos (cada fase de cada repetición,
   cambios de lado, transiciones de superserie, descansos, carrera, calentamiento) y un
   reloj basado en marcas de tiempo la recorre sola. Cuenta 3-2-1 con pitido final en todo
   lo cronometrado; tonos distintos para bajar, pausa, subir y apretar; voz con el conteo.

const TEMPO_DEF={c:"3-0-1-0",i:"2-0-1-1",core:"2-0-1-0"};
/* Ejercicios que empiezan subiendo/tirando (concéntrica primero) */
const CON_FIRST=new Set(["invertido","invsup","nordico","crunchb","revcrunch","pullapart","domsub","pendlay","invertido","invsup","remoan","curlb","bayes","martillo","curlband","face","jalon1","dominada","chinup","hipunil","gemelo","pajaro","lean","latband","latmyo","triband","colgado","vup"]);
const PULL=new Set(["domsub","pullapart","pendlay","invertido","invsup","remoan","face","jalon1","dominada","chinup","pullover"]);
const PUSH=new Set(["militar","floor","flexdef","fondos","fondosan","extri"]);
const POWER={pushpress:[4,"Empuja"],cmj:[4,"Salta"],broad:[5,"Salta"],skater:[3,"Salta"],flexplio:[3,"Explota"]};
const REPSEC={tgu:[25,"Levanta"]};
function tempoOf(e){return(e.tp||TEMPO_DEF[e.k]||"2-0-1-0").split("-").map(x=>x==="X"?1:+x)}
function phaseWord(id,k){
  if(k==="con")return PULL.has(id)?"Tira":PUSH.has(id)?"Empuja":"Sube";
  if(k==="ecc")return PULL.has(id)?"Controla":"Baja";
  if(k==="iso")return CON_FIRST.has(id)?"Estira":"Pausa";
  return"Aprieta";
}
const TONE={ecc:523,iso:740,con:880,top:740,work:988};
const SIDE={"/pierna":"pierna","/brazo":"brazo","/lado":"lado","s/lado":"lado","m/lado":"lado"};
const unitWord=e=>e.u==="s"||e.u==="s/lado"?"segundos":e.u==="m/lado"?"metros":e.u==="min"?"minutos":"repeticiones";
const targetOf=i=>i.e.r[0]===i.e.r[1]?i.e.r[0]:i.p.t;

function repSegs(i,reps,label){
  const e=i.e,out=[];
  const fixed=POWER[i.id]||REPSEC[i.id];
  if(fixed){for(let r=1;r<=reps;r++)out.push({ph:"work",d:fixed[0],big:fixed[1],rep:r,reps,rs:true,tone:TONE.work,label,rd:fixed[0],off:0});return out}
  const PZ=[[0,1],[1,1],[1,0],[0,0]];
  const tp=tempoOf(e);
  const order=CON_FIRST.has(i.id)?[["con",2],["top",3],["ecc",0],["iso",1]]:[["ecc",0],["iso",1],["con",2],["top",3]];
  for(let r=1;r<=reps;r++){
    let first=true,off=0;const rd=tp.reduce((a,x)=>a+x,0);
    order.forEach(([k,j],oi)=>{if(tp[j]>0){out.push({ph:k,d:tp[j],big:phaseWord(i.id,k),rep:r,reps,tone:TONE[k],label,rs:first,pz:PZ[oi],rd,off,tp:order.map(([kk,jj])=>[kk,tp[jj]]).filter(x=>x[1]>0)});off+=tp[j];first=false}});
  }
  return out;
}
function setSegs(i,s){
  const e=i.e,t=targetOf(i),side=SIDE[e.u];
  let block;
  if(e.u==="s"||e.u==="s/lado")block=()=>[{ph:"hold",d:t,big:"Aguanta",cd:true}];
  else if(e.u==="m/lado")block=()=>[{ph:"hold",d:Math.round(t*1.2),big:"Camina",cd:true,txt:t+" metros"}];
  else if(e.u==="min"){const o=[];for(let m=1;m<=t;m++)o.push({ph:"hold",d:60,big:"Minuto "+m,cd:true,txt:"5 remos · 5 rumanos · 5 frontales · 5 press"});block=()=>o}
  else block=lab=>repSegs(i,t,lab);
  let segs=[];
  if(i.myo){
    segs=repSegs(i,t,"Activación");
    for(let k=1;k<=4;k++){segs.push({ph:"rest",mini:true,d:15,big:"Respira",cd:true,txt:"5 respiraciones profundas"});segs=segs.concat(repSegs(i,4,"Mini-serie "+k))}
  }else if(side){
    segs=block(side==="lado"?"Lado derecho":side==="pierna"?"Pierna derecha":"Brazo derecho")
      .concat([{ph:"switch",d:6,big:"Cambia de "+side,cd:true}])
      .concat(block(side==="lado"?"Lado izquierdo":side==="pierna"?"Pierna izquierda":"Brazo izquierdo"));
  }else segs=block("");

}
function buildTimeline(ses,dry){
  const T=[];let grp=0;const rs=ses.runScale||1;
  const push=o=>T.push(Object.assign({grp},o));
  const pushEls=(els,seqn,extra)=>els.forEach(e=>{
      if(e[0]==="int"){const[,nm,w,r,n,a]=e;for(let k=1;k<=n;k++){push(Object.assign({ph:"hold",d:w,big:"¡Fuerte!",title:nm,arch:a,anim:1,sub:"Ronda "+k+" de "+n,cd:true,seqn},extra));if(k<n)push(Object.assign({ph:"rest",mini:true,d:r,big:"Descansa",txt:"Siguiente ronda",cd:true,seqn},extra))}grp++;return}
      const[nm,d,a,sides,m]=e,base=Object.assign({ph:"hold",d,big:m?"Muévete":"Mantén",title:nm,arch:a,anim:!!m,cd:true,seqn},extra);
      if(sides){push(Object.assign({},base,{label:"Lado derecho"}));push(Object.assign({ph:"switch",d:6,big:"Cambia de lado",cd:true,seqn},extra));push(Object.assign({},base,{label:"Lado izquierdo"}))}else push(base);
      grp++});
  const warm=(WARMSEQ[ses.day.w]||WARMSEQ.sup).filter(e=>!ses.short||e[e.length-1]===1||e[6]===1);
  pushEls(warm,"Calentamiento",{warm:true});
  const groups=[];ses.items.forEach(i=>{const last=groups[groups.length-1];if(i.g&&last&&last.g===i.g&&!last.solo)last.items.push(i);else groups.push({g:i.g,solo:!i.g,items:[i]})});
  groups.forEach((gr,gi)=>{
    const i0=gr.items[0];
    if(i0.seq){pushEls(i0.seq,i0.name);return}
    if(false){i0.seq.forEach(e=>{
      if(e[0]==="int"){const[,nm,w,r,n,a]=e;for(let k=1;k<=n;k++){push({ph:"hold",d:w,big:"¡Fuerte!",title:nm,arch:a,anim:1,sub:"Ronda "+k+" de "+n,cd:true,seqn:i0.name});if(k<n)push({ph:"rest",mini:true,d:r,big:"Descansa",txt:"Siguiente ronda",cd:true,seqn:i0.name})}grp++;return}
      const[nm,d,a,sides,m]=e,base={ph:"hold",d,big:m?"Muévete":"Mantén",title:nm,arch:a,anim:!!m,cd:true,seqn:i0.name};
      if(sides){push(Object.assign({},base,{label:"Lado derecho"}));push({ph:"switch",d:6,big:"Cambia de lado",cd:true,seqn:i0.name});push(Object.assign({},base,{label:"Lado izquierdo"}))}else push(base);
      grp++});return}
    if(i0.mob){MOB.forEach(x=>{push({ph:"list",d:120,big:"Movilidad",txt:x,cd:true});grp++});return}
    if(i0.run){
      const name=RUN_NAME[i0.run]||"Carrera";
      i0.ph.forEach((p,k)=>{push({ph:p.k==="run"?"run":"walk",d:rs<1?Math.max(5,Math.round(p.s*rs/5)*5):p.s,big:p.k==="run"?(p.t==="Sprint"?"Sprint":p.t==="Correr"?"Corre":p.t):(p.fast?"Rápido en cuesta":p.t==="Anda en cuesta"||p.t==="Anda a paso vivo"?p.t:"Anda"),txt:name,phn:k+1,phof:i0.ph.length,cd:true,rateId:rated(i0.run)&&k===i0.ph.length-1?"run:"+i0.run:null});grp++});
      return;
    }
    const maxS=Math.max(...gr.items.map(i=>i.sets)),hasC=gr.items.some(i=>i.e.k==="c"),multi=gr.items.length>1;
    /* Superseries antagonistas: 60 s (45 s en aislamiento); ejercicio solo: 75 s multiarticular, 45 s el resto */
    const rest=multi?(hasC?60:45):Math.min(Math.max(...gr.items.map(i=>i.e.rest||0))||60,hasC?75:45);
    for(let s=1;s<=maxS;s++){
      const round=gr.items.filter(i=>i.sets>=s);
      round.forEach((i,j)=>{
        const prev=T[T.length-1];
        if(j>0)push({ph:"switch",d:12,big:"Cambia",ex:i,set:s,of:i.sets,cd:true});
        else if(!prev||prev.ph!=="rest")push({ph:"prep",d:12,big:"Prepárate",ex:i,set:s,of:i.sets,cd:true});
        const segs=setSegs(i,s);
        if(s===i.sets&&i.e.k!=="p")segs[segs.length-1].rateId=i.id;
        segs.forEach(push);grp++;
      });
      const nextIsSet=s<maxS||gi<groups.length-1&&!groups[gi+1].items[0].run&&!groups[gi+1].items[0].mob;
      push({ph:"rest",d:nextIsSet?rest:Math.min(rest,45),big:"Descanso",cd:true});grp++;
    }
  });
  pushEls(COOLSEQ,"Vuelta a la calma",{cool:true});

}
function finalizeT(T){
  for(let k=T.length-1,nx="Vuelta a la calma";k>=0;k--){const s=T[k];s.next=nx;if(s.ex&&s.ph!=="rest")nx=exName(s.ex.e,s.ex.p.vi)+(s.of>1?" · serie "+s.set+" de "+s.of:"");else if(s.ph==="run"||s.ph==="walk")nx=s.txt;else if(s.ph==="list")nx=s.big;else if(s.title)nx=s.title}
  let c=0;T.forEach(s=>{s.at=c;c+=s.d});T.total=c;

/* Ajuste exacto a 30/45/60 min: estira descansos (hasta +35 %), añade movilidad y el último segundo lo absorbe la vuelta a la calma */
function fitExact(T,target){
  let gap=target-T.reduce((a,s)=>a+s.d,0);
  if(gap>0){
    const rests=T.filter(s=>s.ph==="rest"&&!s.mini),rt=rests.reduce((a,s)=>a+s.d,0);
    if(rt>0){const add=Math.min(gap,Math.round(rt*.1));let used=0;rests.forEach(s=>{const x=Math.floor(add*s.d/rt/5)*5;s.d+=x;used+=x});gap-=used}
    let ci=T.findIndex(s=>s.cool),k=0;const g0=T[ci].grp;
    while(gap>=45){const d=Math.min(120,gap);T.splice(ci+k,0,{ph:"list",d,big:"Movilidad",txt:MOB[k%MOB.length],cd:true,grp:g0-.5+k*.01});gap-=d;k++}
    T[T.length-1].d+=gap;
  }else if(gap<0){
    for(const s of T.filter(x=>x.ph==="list"||(x.ph==="hold"&&(x.warm||x.cool))).reverse()){if(gap>=0)break;const cut=Math.min(s.d-15,-gap);if(cut>0){s.d-=cut;gap+=cut}}
  }
}

function scheduleSeg(s,prev){
  clearSched();const lag=(Date.now()-G.segStart)/1000;

  if(tempo&&lag<.3){

    else if(s.ph==="con")sglide(0,360,760,Math.min(380,len),.18);

function persistLive(){if(!G||G.review)return;S.live={date:G.date,idx:G.idx,r:G.r,t0:G.t0};save()}
function loop(){
  if(!G||G.paused||G.review)return;

  while(el>=s.d&&guard++<500){

  }

    let t=null;
    if((s.ph==="run"||s.ph==="walk")&&left>=60&&left%60===0&&s.d-left>=30)t=left===60?"Queda un minuto":"Quedan "+left/60+" minutos";
    else if(left===30&&((s.ph==="rest"&&s.d>=90)||(s.ph==="hold"&&s.d>=50)))t="Treinta segundos";

    if(t){G.beeped["L"+left]=1;say(t)}
  }
  if(s.ph==="hold"&&s.d>=30&&!G.beeped.half&&el>=s.d/2&&Math.ceil(s.d-el)>14){G.beeped.half=1;say("Mitad",{skip:1})}
  const go=document.querySelector(".go");if(go){const fin=s.cd&&s.d>=4&&left<=3;if(fin!==go.classList.contains("final"))go.classList.toggle("final",fin)}
  const cd=document.getElementById("cd");if(cd){const v=fmtLeft(left);if(cd.textContent!==v)cd.textContent=v}
  const pc=document.getElementById("pc");if(pc){const v=String(left);if(pc.textContent!==v)pc.textContent=v}
  const pr=document.getElementById("gp");if(pr)pr.style.width=Math.min(100,((s.at+el)/G.T.total)*100).toFixed(2)+"%";

}
function endSeg(s,quiet){

}
function enterSeg(prev){
  const s=G.T[G.idx];G.beeped={};

  const name=s.ex?exName(s.ex.e,s.ex.p.vi):"";
  const durTxt=d0=>{const d=Math.round(d0/5)*5||d0;if(d<60)return d+" segundos";const m=Math.floor(d/60),r=d%60,mt=m===1?"un minuto":m+" minutos";return r===30?mt+" y medio":r?mt+" y "+r+" segundos":mt};
  const reps=x=>{const t=targetOf(x);return t+" "+unitWord(x.e)+(SIDE[x.e.u]?" por "+SIDE[x.e.u]:"")};
  if(s.ph==="switch"&&s.big.startsWith("Cambia de")){const nx=G.T[G.idx+1];flashSide(nx&&nx.label?nx.label:s.big);say(nx&&nx.label?nx.label:s.big,{urgent:1})}

  }

  else if(s.ph==="hold"&&s.title)say(s.title.split(" · ")[0]+(s.label?", "+s.label.toLowerCase():"")+". "+durTxt(s.d)+".",{urgent:1});
  else if(s.ph==="hold")say(s.big==="Camina"?"Camina "+s.txt:"Aguanta "+durTxt(s.d),{urgent:1});
  else if(s.ph==="run"||s.ph==="walk")say(s.big+", "+durTxt(s.d),{urgent:1});
  else if(s.ph==="list")say(s.txt);

function jump(to){

  G.idx=n;G.segStart=Date.now();if(G.paused)G.pauseAt=Date.now();
  try{speechSynthesis.cancel()}catch(e){}
  enterSeg(null);
}

  if(G.idx>start||el>2)jump(start);else{const pg=G.T.slice(0,start).reverse().find(s=>s.ph!=="rest");if(pg)jump(G.T.findIndex(s=>s.grp===pg.grp))}}

function saveSurvey(){
  const ses=SV.ses,rat={};
  ses.items.forEach(i=>{if(i.run&&rated(i.run)){const k="run:"+i.run,v=SV.r[k];rat[k]=v&&typeof v==="object"?v:{r:"bien"}}else if(i.id&&i.e.k!=="p")rat[i.id]=SV.r[i.id]||"bien"});
  Object.entries(SV.ld).forEach(([id,v])=>{v=v.trim();if(v)S.prog[id]=Object.assign({},S.prog[id],{load:v})});
  const prs=commitPRs(ses,rat,SV.date);
  const wins=finishSession(SV.date,rat,ses,{srpe:SV.srpe,min:SV.min,energy:SV.energy,joints:SV.joints.slice()});
  const changes=[];
  Object.keys(SV.swap).forEach(o=>{if(!SV.swap[o])return;const old=EX[SUB(o)].n,used=new Set(Object.values(S.swap)),day=new Set(PLAN[dow(SV.date)].long.concat(PLAN[dow(SV.date)].short).map(r=>parseItem(r).id).filter(Boolean));const alt=alternatives(o,day).find(x=>!used.has(x)&&x!==SUB(o));if(alt){ensureEx(alt);S.swap[o]=alt;changes.push({t:"Nuevo ejercicio: "+EX[alt].n,s:"Sustituye a "+old+"."})}});
  const nx=addDays(SV.date,1);
  SV.joints.forEach(j=>{const c=jointCount(j,nx),lab=JOINTS.find(x=>x[0]===j)[1].toLowerCase();changes.push(c>=2?{t:"Protección de "+lab,s:"Molestia repetida: se sustituyen los ejercicios que más la cargan. Si sigue, consulta a un fisio."}:{t:"Cuidado con "+lab,s:"Menos series y más margen en los ejercicios que la cargan."})});
  S.live=null;save();
  const list=prs.map(p=>({t:"Récord guardado",s:p,top:1})).concat(wins,changes);
  $("#layer").innerHTML=`<div class="go" role="dialog" aria-modal="true" aria-label="Plan ajustado"><div class="go-body"><div class="go-main"><div class="eyebrow">Carga ${SV.srpe*SV.min} UA · dureza ${SV.srpe}</div><div class="go-name">Plan ajustado</div><ul class="wins">${(list.length?list:[{t:"Plan mantenido",s:"Repite objetivos y busca mejor técnica."}]).slice(0,7).map(w=>`<li class="${w.top?"top":""}">${esc(w.t)}<span>${esc(w.s)}</span></li>`).join("")}</ul></div></div><div class="go-foot"><button class="primary" data-sv="done">Cerrar</button></div></div>`;
  SV=null;
}

/* ============ Modelo de carga (sRPE × minutos, Foster 2001) ============ */
function loadSeries(end,days){const out=[];for(let i=days-1;i>=0;i--){const l=S.logs[addDays(end,-i)];out.push(l&&l.st==="done"&&l.load?l.load:0)}return out}
function ewma(arr,n){const l=2/(n+1);let v=0;return arr.map(x=>v=x*l+v*(1-l))}
function loadStats(date){
  const arr=loadSeries(addDays(date,-1),56),A=ewma(arr,7),C=ewma(arr,28);
  const a=A[A.length-1],c=C[C.length-1],w=arr.slice(-7),mean=w.reduce((s,x)=>s+x,0)/7,sd=Math.sqrt(w.reduce((s,x)=>s+(x-mean)**2,0)/7);
  const mono=sd>0?mean/sd:0,n=Object.values(S.logs).filter(l=>l.load).length;
  return{a,c,acwr:c>0?a/c:0,mono,week:mean*7,strain:mean*7*mono,n};
}
function autoReason(date){
  if(S.noauto[date])return null;
  const prev=[];for(let i=1;i<=10&&prev.length<3;i++){const l=S.logs[addDays(date,-i)];if(l&&l.st==="done"&&l.srpe)prev.push(l)}
  if(prev.length>=2&&prev[0].srpe>=9&&prev[1].srpe>=9)return"Tus dos últimas sesiones fueron de 9 o más sobre 10.";
  if(prev.length>=3&&prev.filter(l=>l.energy==="baja").length>=2)return"Llegaste con energía baja a 2 de tus 3 últimas sesiones.";
  const st=loadStats(date);
  if(st.n>=10&&st.acwr>1.5)return"Tu carga reciente es "+st.acwr.toFixed(2)+" veces tu media de 4 semanas (por encima de 1,5).";
  if(st.n>=7&&st.mono>2)return"Monotonía alta ("+st.mono.toFixed(1)+"): todas las sesiones de la semana han sido igual de duras.";
  return null;
}
function jointCount(j,date){let n=0;for(let i=1;i<=7;i++){const l=S.logs[addDays(date,-i)];if(l&&l.joints&&l.joints.includes(j))n++}return n}

/* ============ Ajuste de la sesión al tiempo elegido ============ */
function fitSession(ses){
  const target=ses.target,tot=()=>buildTimeline(ses,true).total;let guard=0;
  ses.runScale=1;
  while(tot()>target&&guard++<60){const k=ses.items.map((x,i)=>x.opt?i:-1).filter(i=>i>=0).pop();if(k===undefined)break;ses.items.splice(k,1)}
  while(tot()>target&&guard++<300){let cut=false;for(let i=ses.items.length-1;i>=0;i--){const it=ses.items[i];if(!it.id||it.myo)continue;const min=it.g==="A"&&it.e.k==="c"?2:1;if(it.sets>min){it.sets--;cut=true;break}}if(!cut)break}
  while(tot()>target&&guard++<360){const idx=ses.items.map((x,i)=>x.id||x.mob?i:-1).filter(i=>i>=0);if(idx.length<=1)break;ses.items.splice(idx[idx.length-1],1)}
  if(tot()>target){const T=buildTimeline(ses,true),rs=T.filter(s=>s.ph==="run"||s.ph==="walk").reduce((a,s)=>a+s.d,0);if(rs>0)ses.runScale=Math.max(.3,(rs-(T.total-target))/rs)}
  let added=true;while(added&&guard++<500){added=false;for(const it of ses.items){if(!it.id||it.myo||it.e.k==="p"||it.e.u==="min"||!/^[AB]$/.test(it.g))continue;const cap=ses.ph.k==="desc"||ses.tired||it.soft||ses.ph.k==="vuelta1"?it.base:it.base+1;if(it.sets<cap){it.sets++;if(tot()<=target){added=true;break}it.sets--}}}
}

/* ============ Historial y carga en Progreso ============ */
function loadCard(){
  const t=todayISO(),arr=loadSeries(t,56),A=ewma(arr,7).slice(-28),C=ewma(arr,28).slice(-28),L=arr.slice(-28);
  if(!L.some(x=>x>0))return`<div class="card"><h2>Carga de entrenamiento</h2><p class="empty">Se calcula con la encuesta: dureza (1–10) × minutos. Aparecerá tras tu primera sesión.</p></div>`;
  const st=loadStats(addDays(t,1)),W=320,H=130,max=Math.max(...L,...A,...C,1),x=i=>24+i*(W-30)/27,y=v=>H-18-(v/max)*(H-30);
  const bars=L.map((v,i)=>v?`<rect x="${x(i)-3.5}" y="${y(v)}" width="7" height="${H-18-y(v)}" rx="1.5" fill="var(--muted)" opacity=".35"/>`:"").join("");
  const line=(S2,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" points="${S2.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}"/>`;
  const lab=[0,13,27].map(i=>`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${parse(addDays(t,i-27)).getDate()}/${parse(addDays(t,i-27)).getMonth()+1}</text>`).join("");
  const z=st.acwr===0?"":st.acwr>1.5?"pico de carga":st.acwr<.8?"carga baja":"zona estable";
  return`<div class="card"><h2>Carga de entrenamiento</h2>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga diaria y medias de 7 y 28 días" style="width:100%;height:auto"><line x1="22" x2="${W}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>${bars}${line(C,"var(--muted)",1.5)}${line(A,"var(--accent)",2.5)}<circle cx="${x(27)}" cy="${y(A[27])}" r="3.5" fill="var(--accent)"/>${lab}</svg>
   <div class="legend"><span><i style="background:var(--accent)"></i>media 7 días</span><span><i style="background:var(--muted)"></i>media 28 días</span><span><i style="background:var(--muted);opacity:.35"></i>carga del día</span></div>
   <div class="kpis"><div><b class="num">${st.acwr?st.acwr.toFixed(2):"–"}</b><span>agudo:crónico${z?" · "+z:""}</span></div><div><b class="num">${st.mono?st.mono.toFixed(1):"–"}</b><span>monotonía</span></div><div><b class="num">${Math.round(st.week)}</b><span>carga 7 días (UA)</span></div></div>
   <p class="sub" style="font-size:12px">Carga = dureza × minutos (Foster). Medias exponenciales de 7 y 28 días. Son orientativas: su capacidad de predecir lesiones está discutida, así que solo se usan para suavizar la sesión siguiente cuando se disparan.</p></div>`;
}

});

document.addEventListener("change",e=>{if(e.target.id==="start"&&e.target.value){S.settings.start=e.target.value;save();render()}if(e.target.dataset&&"hora" in e.target.dataset&&/^\d{1,2}:\d{2}$/.test(e.target.value)){S.settings.hora=e.target.value;save();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!G)closeSheet()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G){keepAwake();if(actx&&actx.state==="suspended")actx.resume()}});

evaluateWeeks();
render();

/* ============ Sincronización con la cuenta ============ */
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    dbRef=db.doc("data/users/"+uid+"/entreno");
    const snap=await dbRef.get();
    if(snap.exists){const remote=snap.data();if((remote.updated||0)>=(S.updated||0)){S=normalize(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}else save()}
    else save();
    sync="cloud";evaluateWeeks();if(!G)render();
  }catch(e){sync="local"}
})();
</script>
